name: Build RosKenorRedirect.dylib (iOS arm64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'RoS_Server_backend/tools/RosKenorRedirect.m'
      - 'RoS_Server_backend/tools/ros_assets_data.h'
      - 'RoS_Server_backend/tools/fishhook.c'
      - 'RoS_Server_backend/tools/fishhook.h'
      - '.github/workflows/build-dylib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dylib:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile RosKenorRedirect.dylib (arm64 iphoneos)
        run: |
          clang -arch arm64 \
            -isysroot "$(xcrun --sdk iphoneos --show-sdk-path)" \
            -miphoneos-version-min=12.0 \
            -shared -fobjc-arc -Wno-deprecated-declarations \
            -framework Foundation -framework UIKit -framework QuartzCore -framework WebKit -framework Security -framework CFNetwork \
            -install_name @executable_path/Frameworks/RosKenorRedirect.dylib \
            -o RosKenorRedirect.dylib \
            RoS_Server_backend/tools/RosKenorRedirect.m \
            RoS_Server_backend/tools/fishhook.c
          file RosKenorRedirect.dylib
          otool -L RosKenorRedirect.dylib

      - name: Upload RosKenorRedirect.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: RosKenorRedirect-dylib
          path: RosKenorRedirect.dylib
          if-no-files-found: error
