name: Build RosKenorRedirect.dylib (iOS arm64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'RoS_Server_backend/tools/RosKenorRedirect.m'
      - 'RoS_Server_backend/tools/ros_assets_data.h'
      - 'RoS_Server_backend/tools/fishhook.c'
      - 'RoS_Server_backend/tools/fishhook.h'
      - 'RoS_Server_backend/tools/Makefile'
      - '.github/workflows/build-dylib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dylib:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos + iPhoneOS SDK on Ubuntu
        uses: beerpiss/theos-action@v1
        with:
          theos-dir: '${{ github.workspace }}/theos'

      - name: Compile RosKenorRedirect.dylib (arm64 iphoneos)
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          make -C RoS_Server_backend/tools FINALPACKAGE=1
          BUILT_DYLIB=$(find RoS_Server_backend/tools/.theos/obj -name "RosKenorRedirect.dylib" -type f | head -n 1)
          test -n "$BUILT_DYLIB"
          cp "$BUILT_DYLIB" RosKenorRedirect.dylib
          if command -v "$THEOS/toolchain/linux/iphone/bin/install_name_tool" >/dev/null 2>&1; then
            "$THEOS/toolchain/linux/iphone/bin/install_name_tool" -id @executable_path/Frameworks/RosKenorRedirect.dylib RosKenorRedirect.dylib
          fi
          file RosKenorRedirect.dylib
          ls -lh RosKenorRedirect.dylib

      - name: Upload RosKenorRedirect.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: RosKenorRedirect-dylib
          path: RosKenorRedirect.dylib
          if-no-files-found: error
