name: Build RosKenorRedirect.dylib (iOS arm64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'RoS_Server_backend/tools/RosKenorRedirect.m'
      - 'RoS_Server_backend/tools/ros_assets_data.h'
      - 'RoS_Server_backend/tools/fishhook.c'
      - 'RoS_Server_backend/tools/fishhook.h'
      - 'RoS_Server_backend/tools/Makefile'
      - '.github/workflows/build-dylib.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dylib:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clang + LLD (Mach-O) and fetch iPhoneOS SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks

      - name: Compile RosKenorRedirect.dylib (arm64 iphoneos)
        run: |
          SDK=$(ls -d /tmp/theos-sdks/iPhoneOS*.sdk | sort -V | tail -n 1)
          echo "Using SDK: $SDK"
          clang -c --target=arm64-apple-ios12.0 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fPIC -O2 \
            RoS_Server_backend/tools/fishhook.c -o fishhook.o
          clang -c --target=arm64-apple-ios12.0 \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -fobjc-arc -fobjc-runtime=ios-12.0 -Wno-deprecated-declarations \
            -fPIC -O2 \
            RoS_Server_backend/tools/RosKenorRedirect.m -o RosKenorRedirect.o
          clang --target=arm64-apple-ios12.0 -fuse-ld=lld \
            -isysroot "$SDK" \
            -miphoneos-version-min=12.0 \
            -shared \
            -F"$SDK/System/Library/Frameworks" \
            -L"$SDK/usr/lib" \
            -framework Foundation -framework UIKit -framework QuartzCore -framework WebKit -framework Security -framework CFNetwork \
            -lobjc \
            -Wl,-install_name,@executable_path/Frameworks/RosKenorRedirect.dylib \
            RosKenorRedirect.o fishhook.o \
            -o RosKenorRedirect.dylib
          file RosKenorRedirect.dylib
          llvm-objdump --macho --dylib-id --dylibs-used RosKenorRedirect.dylib
          ls -lh RosKenorRedirect.dylib

      - name: Upload RosKenorRedirect.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: RosKenorRedirect-dylib
          path: RosKenorRedirect.dylib
          if-no-files-found: error
